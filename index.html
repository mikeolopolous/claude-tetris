<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1 class="title">TETRIS</h1>
    <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false">
      <span class="track"><span class="thumb"></span></span>
      <span id="theme-toggle-label">Modo claro</span>
    </button>
  </header>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title">TETRIS</p>
        <p id="overlay-score"></p>
        <p id="record-msg" class="record-msg hidden"></p>

        <form id="name-form" class="name-form hidden">
          <label for="player-name">Tu nombre</label>
          <input id="player-name" type="text" maxlength="12" autocomplete="off" spellcheck="false" />
          <button type="submit">Guardar</button>
        </form>

        <section id="records" class="records hidden">
          <span class="label">MEJORES PUNTUACIONES</span>
          <table class="records-table">
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Combo</th></tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <div class="records-extra">
            <span>Mejor combo: <b id="best-combo">0</b></span>
            <span>Líneas máx.: <b id="max-lines">0</b></span>
          </div>
          <button id="reset-records" class="link-btn" type="button">Borrar récords</button>
        </section>

        <button id="restart-btn">Jugar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
