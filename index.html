<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1 class="title">TETRIS</h1>
    <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false">
      <span class="track"><span class="thumb"></span></span>
      <span id="theme-toggle-label">Modo claro</span>
    </button>
    <label class="skin-picker">
      <span>Skin</span>
      <select id="skin-select" aria-label="Skin visual"></select>
    </label>
  </header>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn" class="menu-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-label="Menú de pausa">
      <div class="overlay-box pause-box">
        <p class="pause-title">PAUSA</p>
        <button id="resume-btn" class="menu-btn">Reanudar</button>
        <button id="pause-restart-btn" class="menu-btn secondary">Reiniciar</button>
        <button id="controls-btn" class="menu-btn secondary" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>

        <ul id="pause-controls" class="pause-controls hidden">
          <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
          <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
          <li><span><kbd>↓</kbd></span> bajar</li>
          <li><span><kbd>Espacio</kbd></span> caída</li>
          <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa</li>
        </ul>

        <div class="start-level">
          <label for="start-level">Nivel inicial</label>
          <select id="start-level">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
          <small>Se aplica en la próxima partida</small>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
